name: Update tournaments

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: update-tournaments
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser
        run: |
          npm init -y > /dev/null
          npm install playwright --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch tournaments from ClubLocker
        run: node scripts/fetch-tournaments.mjs

      - name: Save debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain tournaments.json)" ]; then
            git config user.name "tournament-bot"
            git config user.email "tournament-bot@users.noreply.github.com"
            git add tournaments.json
            git commit -m "Update tournaments"
            git push
          fi
